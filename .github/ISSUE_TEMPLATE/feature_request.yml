name: ✨ Feature request
description: Suggest an improvement to the Action or its tooling.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please explain the **problem** you are trying to solve, not just the solution.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues.
          required: true
        - label: This cannot already be done by setting the matching environment variable as `env` on the step.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - New input on an existing scan
        - New scan command
        - Outputs, artifacts or caching
        - Runner script (src/run-scanner.sh)
        - Validation scripts / tests / CI
        - Documentation (README, docs/, examples/)
        - Release and versioning
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        For a new input, name the environment variable the scanner image already reads —
        the Action forwards variables, it does not implement scanning behaviour.
    validations:
      required: true

  - type: dropdown
    id: parity
    attributes:
      label: Does it apply to the GitLab templates too?
      description: |
        Input names are kept identical to Tooark/template-ci-security-scanner, in kebab-case here
        and snake_case there. A new input usually belongs in both.
      options:
        - Yes — I will open, or have opened, the matching issue there
        - No — it only makes sense on GitHub Actions
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Anything else?
