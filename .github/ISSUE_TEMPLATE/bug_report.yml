name: 🐛 Bug report
description: Report a defect in the GitHub Action or its runner script.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        For **security vulnerabilities**, do NOT file a public issue — see [`SECURITY.md`](https://github.com/Tooark/action-security-scanner/blob/main/SECURITY.md).
        Using **GitLab CI**? The templates live in [`Tooark/template-ci-security-scanner`](https://github.com/Tooark/template-ci-security-scanner/issues/new/choose).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am pinning a released tag, not `main`.
          required: true
        - label: This is not a security vulnerability (those go through the private channel).
          required: true
        - label: This is a defect in the Action, not a finding the scanner reported in my own code.
          required: true

  - type: dropdown
    id: command
    attributes:
      label: Which scan?
      options:
        - full-scan
        - image-scan
        - filesystem-scan
        - config-scan
        - repo-scan
        - dockerfile-lint
        - secret-scan
        - Not scan-specific (release, docs, tooling)
    validations:
      required: true

  - type: input
    id: component-version
    attributes:
      label: Action version
      description: The tag or commit SHA you pinned.
      placeholder: "e.g., v1.0.0"
    validations:
      required: true

  - type: input
    id: scanner-version
    attributes:
      label: Scanner image tag
      description: Leave the default unless you overrode scanner-version.
      placeholder: "e.g., ghcr.io/tooark/security-scanner:1.10"
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Runner
      description: Self-hosted runners are where image-scan, caching and file ownership behave differently.
      options:
        - GitHub-hosted (ubuntu-latest or a pinned ubuntu-*)
        - Self-hosted — ephemeral
        - Self-hosted — long-lived or shared
        - Job running inside a container (container:)
        - Other
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Workflow snippet
      description: The step that reproduces the problem, with its `with:` and `env:` — and the `actions/checkout` step before it.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        The job log around the failure. **Redact credentials, tokens and any detected secret** —
        a scan log can quote the finding that tripped the gate.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Variables set as env, a custom reports-dir, a proxy, a registry mirror, etc.
